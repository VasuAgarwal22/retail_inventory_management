name: Retail Inventory Management CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retail-inventory

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retail_inventory_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d retail_inventory_management"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/retail_inventory_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: retail-inventory/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Angular build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retail-inventory/frontend/retailstock-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: retail-inventory/frontend/retailstock-angular/package-lock.json

      # Use npm install because the current lockfile is not synchronized.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular application
        run: npm run build
