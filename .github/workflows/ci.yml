
name: Retail Inventory Management CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot Backend Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retail-inventory

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: retail-inventory/pom.xml

      - name: Build and Test Backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  frontend:
    name: Angular Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retail-inventory/frontend/retailstock-angular

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: retail-inventory/frontend/retailstock-angular/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build
